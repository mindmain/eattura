name: App release PR

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-release-please
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs['eattura--release_created'] }}
      tag: ${{ steps.release.outputs['eattura--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  desktop:
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
