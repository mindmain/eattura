version: "3"
vars:
  APP_DIR: eattura
  PROTO_DIR: proto
  COMMON_DIR: common
  BUN: bun

tasks:
  pull:
    cmds:
      - git submodule update --remote --merge
    desc: Pull the latest changes from the main branch
  default:
    desc: "Run the development environment (Hot Reload)"
    cmds:
      - task: dev
  install:
    desc: "Install locked app dependencies and prepare protobuf definitions"
    cmds:
      - task: install:submodules
      - task: install:frontend
      - cargo fetch --locked
      - task: proto
  install:submodules:
    internal: true
    status:
      - test -f proto/eattura/sdi/v1/invoice.proto
      - git diff --quiet --ignore-submodules=dirty HEAD -- proto
    cmds:
      - git submodule update --init --recursive
  install:frontend:
    internal: true
    dir: "{{.APP_DIR}}"
    cmds:
      - "{{.BUN}} install --frozen-lockfile"
  proto:
    desc: "Download and prepare protobuf dependencies"
    cmds:
      - echo "📜 Exporting proto dependencies..."
      - "{{.BUN}} scripts/release.mjs proto"
    status:
      - test -f proto/vendor/buf/validate/validate.proto

  # --- DEVELOPMENT ---
  dev:
    desc: "Run the Desktop app in development mode (Hot Reload)"
    deps: [proto] # Ensure proto files are ready before starting
    dir: "{{.APP_DIR}}"
    cmds:
      - cmd: 'sh ../scripts/run-tauri-dev.sh {{.CLI_ARGS}}'
        platforms: [darwin]
      - cmd: '{{.BUN}} run tauri dev {{.CLI_ARGS}}'
        platforms: [linux, windows]

  test:
    desc: "Run Rust and Angular tests"
    deps: [proto]
    cmds:
      - cargo test --workspace --locked
      - task: test:frontend
  test:frontend:
    internal: true
    dir: "{{.APP_DIR}}"
    cmds:
      - "{{.BUN}} run tsc --noEmit -p tsconfig.spec.json"
      - "{{.BUN}} run test"

  server:
    desc: "Run the Backend Server (separately from the UI)"
    deps: [proto]
    cmds:
      - cargo run --bin server-eattura

  # --- BUILD & PRODUCTION ---
  build:
    desc: "Build the application for production (creates distributables)"
    deps: [proto]
    dir: "{{.APP_DIR}}"
    cmds:
      - |
        SIGN_ARGS=""
        if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PATH:-}" ] && [ -f "${TAURI_SIGNING_PRIVATE_KEY_PATH}" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="${TAURI_SIGNING_PRIVATE_KEY_PATH}"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          elif [ -f "$HOME/.tauri/eattura.key" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$HOME/.tauri/eattura.key"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          else
            SIGN_ARGS='-c {"bundle":{"createUpdaterArtifacts":false}}'
          fi
        fi
        if [ -d "../target/release/bundle/macos" ]; then
          find ../target/release/bundle/macos -maxdepth 1 -name 'rw.*.dmg' -delete
        fi
        CI="${CI:-true}" {{.BUN}} run tauri build {{if .BUILD_TARGET}}--target "{{.BUILD_TARGET}}"{{end}} {{if .BUILD_BUNDLES}}--bundles "{{.BUILD_BUNDLES}}"{{end}} $SIGN_ARGS {{.CLI_ARGS}} -- --locked

  ci:
    desc: "Install dependencies, test, and build installers on the current runner"
    env:
      CI: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    cmds:
      - task: install
      - task: test
      - task: build
        vars:
          CLI_ARGS: --ci

  # --- UTILITIES ---
  icons:
    desc: "Generate platform icons from the FE source SVG"
    dir: "{{.APP_DIR}}"
    cmds:
      - "{{.BUN}} run tauri icon ./src/assets/eattura-mark.svg"

  clean:
    desc: "Clean build directories"
    cmds:
      - cargo clean
      - rm -rf {{.APP_DIR}}/dist
      - rm -rf {{.APP_DIR}}/src-tauri/target
