[package]
name = "server-eattura"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
common.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true

axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-native-tls"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tower = "0.5"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# PEC transport (SMTP send + IMAP receive) and MIME parsing.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
imap = "2.4"
native-tls = "0.2"
mail-parser = "0.9"