[package]
name = "eattura"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "eattura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
common = { path = "../../common" }
tauri = { version = "~2.11.1", features = [] }
tauri-plugin-opener = "~2.5.3"
tauri-plugin-dialog = "~2.7.1"
tauri-plugin-fs = "~2.5.1"
tauri-plugin-process = "~2.3.1"
tauri-plugin-updater = "~2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
toml_edit = "0.23.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
rmcp = { version = "3.8.0", features = ["client", "transport-io"] }
schemars = "1"
secrecy = "0.10"

# PEC transport (SMTP send + IMAP receive), MIME parsing, and OS keyring.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
imap = "2.4"
native-tls = "0.2"
mail-parser = "0.9"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

zip = "9.0.1"
reqwest = { version = "0.13.5", features = ["json", "form"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
