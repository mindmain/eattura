[package]
name = "eattura"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "eattura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[dependencies]
common = { path = "../../common" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

# PEC transport (SMTP send + IMAP receive), MIME parsing, and OS keyring.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
imap = "2.4"
native-tls = "0.2"
mail-parser = "0.9"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Filesystem watcher for multi-vault real-time detection
notify = "6.1"
notify-debouncer-mini = "0.4.1"
zip = "9.0.1"
reqwest = { version = "0.13.5", features = ["json"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
