<div class="app-layout">
  <app-sidebar />
  <main class="main-content">
    <router-outlet />
  </main>
</div>

<!-- Global notifications -->
<div class="notification-container">
  @for (n of notifications.notifications(); track n.id) {
    <div class="notification" [class]="'notification-' + n.type">
      <span>{{ n.message }}</span>
      <button (click)="notifications.dismiss(n.id)">&times;</button>
    </div>
  }
</div>
